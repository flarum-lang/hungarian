    data:
      uploads:
        anonymize_description: 'Eltávolítja a felhasználó hivatkozását a feltöltött fájlokból. A fájlok maguk továbbra is elérhetők lesznek azon felhasználók számára, akik az anonimizálás előtt láthatták azokat.'
        delete_description: 'Törli a felhasználó által feltöltött összes fájlt.'
        export_description: 'A felhasználó által feltöltött összes fájl.'
fof-upload:
  admin:
    help_texts:
      client_extension: "Alapértelmezés szerinte a Feltöltés a MIME-típus alapján választ egy biztonságos fájlkiterjesztést.\nEgyes ZIP vagy bináris adatokat tartalmazó fájltípusoknál ez általános fájlkiterjesztéseket eredményezhet a várt helyett.\nItt megadhatja a fájlkiterjesztések vesszőkkel elválasztott listáját, amelyeknél az eredeti formában marad meg a kiterjesztés.\n"
      composer_buttons: "Alapértelmezetten a médiakezelő és a feltöltés gomb is látható. Választhat, hogy csak az egyik gomb jelenjen meg.\n"
      custom_s3_url: "A kiszolgált fájlok nyilvános alapwebcíme – a tároló elé helyezett CDN vagy egyéni domain.\nHagyj üresen a szolgáltató alapértelmezett webcímének használatához. Tartalmaznia kell\na <code>https://</code> részletet.\n"
      disable-download-logging: "A fórum felhasználóinak letöltéseinek naplózásának letiltása. Az engedélyezve tartás lehetővé teszi, hogy a közeljövőben megtekintse a letöltések számát, és más metrikákat.\n"
      disable-hotlink-protection: "A hivatkozásvédelem megakadályozza a más oldalakon lévő letöltések megnyitását. A jelenlegi módszer CSRF tokent és bejegyzésazonosítót igényel.\n"
      download_templates: "A letöltési sablonok kezelik, hogy a feltöltések hogyan jelennek meg a fórumban, például milyen előnézet vagy gombok jelennek meg. Jelenleg elérhető:\n"
      local_cdn: "Nem kötelező. Ha az <code>assets/files</code> tartalmát CDN-nel szolgálja ki, adja meg az alapwebcímét, és a feltöltött\nfájlok hivatkozásai azt fogják használni. Hagyja üresen, hogy közvetlenül a fórumjáról szolgálja ki a fájlokat.\n"
      mime_order: "A szabályok felülről lefelé lesznek alkalmazva, és az első egyezés nyer, így a specifikusabb szabályokat helyezze az általánosak fölé.\n"
      mime_types: "Döntse el, hogy mely fájlok tagjai tölthessenek fel, hol legyenek tárolva és hogyan jelenjenek meg a bejegyzésekben.\n"
      resize: "Válassza ki, hogy átméretezi-e a képeket a feltöltésük előtt. Képpontokban megadhat egy szélesség- és magasságkorlátot. Az átméretezési folyamat megtartja a képek képarányát.\n"
      s3_acl: "A feltöltött objektumokra alkalmazandó ACL. Hagyja üresen a szolgáltató alapértelmezéséhez (általában privát).\nHasználja a <code>public-read</code> lehetőséget, ha a fájloknak közvetlenül olvashatónak kell lenniük a tárolóból.\n"
      s3_acl_unsupported: "A(z) {provider} nem támogatja az ACL-eket. A nyilvános hozzáférést a szolgáltató saját vezérlőpultján kell beállítani.\n"
      s3_compatible_storage: "A következő beállítások csak akkor szükségesek, ha S3-mal kompatibilis tárolót használ. Ha AWS-t használt, akkor üresen hagyhatja.\n"
      s3_endpoint: "A szolgáltató S3 API-webcíme – nem a tároló nyilvános webcíme. Az Amazon S3-hoz nem szükséges.\n"
      s3_instance_profile: "Hagyja mindkettőt üresen egy IAM szerepkör használatához – csak EC2, ECS vagy EKS esetén működik.\n"
      s3_path_style: "A tárolót a webcím elérési útjára teszi, nem a gépnévére. A MinIO és a Cloudflare R2 esetén szükséges;\nautomatikusan be lesz állítva, amikor szolgáltatót választ.\n"
      s3_provider: "A szolgáltató kiválasztása beállítja lentebb a végponti formátumot, a címzési stílust és az ACL-ek támogatását. Válassza\naz „Egyéb S3-mal kompatibilis” lehetőséget, ha az Öné nem szerepel.\n"
      storage_configure_another: "Az egyéb telepített tárolószolgáltatások, melyek még nincsenek beállítva. A beállítás addig nem változtat\na fájlokon, amíg nem rendeli egy fájltípushoz.\n"
      storage_intro: "Itt jelennek meg a beállított vagy egy fájltípus által használt szolgáltatások. Azelőtt beállíthat\negy szolgáltatást, hogy azt egy fájltípus használná – rendelje hozzá a Fájlok lapon, ha készen áll.\n"
      storage_not_installed: 'Az Amazon S3-at, Cloudflare R2-t vagy a Qiniut keresi? Azokhoz további csomagra van szükség – lásd: <a>tárolóadapterek telepítése</a>.'
      thumbnail_quality: "Kódolási minőség 1 és 100 között, a WebP és JPEG bélyegképekre alkalmazva. A magasabb értékek\nélesebb, de nagyobb fájlokat eredményeznek. A GIF és PNG bélyegképek veszteségmentesek, és\nfigyelmen kívül hagyják ezt a beállítást. A meglévő bélyegképek megtartják a jelenlegi\nminőségüket, amíg újból elő nem állítja őket a backfill paranccsal.\n"
      thumbnails: "Kis méretű bélyegképek létrehozása a képekhez a feltöltés idején. A bélyegkép jelenik meg soron belül;\nrákattintással nyitható meg új lapon a teljes felbontású kép. A bélyegképek jelentősen\ncsökkentik a sok nagy képpel rendelkező fórumok forgalmát és lapméretét.\n"
      watermark: "Válasszon, hogy a képek vízjelet kapjanak-e feltöltéskor. A vízjelek a nem GIF képekhez lesznek adva, a lenti beállítások alapján.\n"
    inspect-mime:
      description: "A FoF Feltöltés a <a>PHP Mime Detector</a> programkönyvtárat használja a gyakori MIME-típusokhoz, tartaléknak pedig a PHP Fileinfót.\nA Fileinfo által visszaadott MIME-érték különbözhet a különböző kiszolgálók esetén!\n"
